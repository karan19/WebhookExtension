<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Knowledge Dump Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      max-width: 480px;
      color: #222;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    fieldset {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin-top: 1.25rem;
    }
    legend {
      font-weight: 600;
      padding: 0 6px;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 0.35rem;
      border: 1px solid #c3c3c3;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    button {
      margin-top: 1.5rem;
      padding: 10px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background: #1d7bf2;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    #status {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      min-height: 1.2rem;
    }
    small {
      display: block;
      color: #666;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <h1>Knowledge Dump Configuration</h1>
  <form id="options-form">
    <fieldset>
      <legend>Snippet endpoint</legend>
      <label for="snippet-webhook-url">
        Webhook URL
        <input type="url" id="snippet-webhook-url" placeholder="https://example.com/snippets" required>
        <small>Used when sending highlighted snippets.</small>
      </label>
      <label for="snippet-token">
        Token
        <input type="text" id="snippet-token" placeholder="Paste secure token" autocomplete="off" required>
        <small>Sent as <code>X-Webhook-Token</code> for snippets.</small>
      </label>
    </fieldset>

    <fieldset>
      <legend>Page endpoint (optional)</legend>
      <label for="page-webhook-url">
        Webhook URL
        <input type="url" id="page-webhook-url" placeholder="https://example.com/pages">
        <small>Required only if you plan to save full pages.</small>
      </label>
      <label for="page-token">
        Token
        <input type="text" id="page-token" placeholder="Paste secure token" autocomplete="off">
        <small>Needed when a page URL/token pair is provided.</small>
      </label>
    </fieldset>

    <button type="submit" id="save-btn">Save</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>
