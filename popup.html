<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Knowledge Dump</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      min-width: 260px;
      padding: 16px;
      margin: 0;
      color: #222;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 0.75rem 0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .status {
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1d7bf2;
    }
    input:focus + .slider {
      box-shadow: 0 0 1px #1d7bf2;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 0.95rem;
      border: none;
      border-radius: 4px;
      background: #f1f1f1;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Knowledge Dump</h1>
  <div class="toggle-row">
    <span>Selection capture</span>
    <label class="switch">
      <input type="checkbox" id="active-toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="status" id="status-text">Loading state...</div>
  <button id="options-btn">Open Options</button>
  <script src="popup.js"></script>
</body>
</html>
